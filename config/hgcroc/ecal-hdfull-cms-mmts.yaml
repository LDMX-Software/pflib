# ECal SMM (HD Full hexaboard, 6 HGCROCv3b) analog settings.
# Source: CMS MMTS HD Full bring-up config initHD-Full-trophyV3_muxA_ped.yaml,
# same values on all ROCs, pedestal runs with 0.95 ADC noise after CM.
# Not tuned: no pedestal trims, Gain_conv and phase_ck at power-on defaults.
# Not copied (CMS bench only): elinks, polarities, EdgeSel_T1, IdleFrame.
# in_inv_cmd_rx left at default: depends on ROC revision (serial char 7).
# DigitalHalf (Bx_offset 2, L1Offset 10, CalibrationSC 1) left out:
# with it every ADC sample read 0 at ESA (adc_tm1 fine), set from a latency scan instead.
GlobalAnalog_*:
  Delay40: 2
  Delay65: 3
  Delay87: 3
  Delay9: 3
  Ibi_inv_buf: 0
  Ibi_noinv_buf: 0
  Ibo_inv_buf: 12
  Ibo_noinv_buf: 12
  dac_pol: 0
  range_inv: 6
  range_tot: 7
  trim_vbi_pa: 15
MasterTdc_*:
  BIAS_CAL_DAC_CTDC_P_D: 2
  BIAS_CAL_DAC_CTDC_P_EN: 1
  BIAS_FOLLOWER_CAL_P_CTDC_D: 4
  BIAS_FOLLOWER_CAL_P_CTDC_EN: 1
  BIAS_FOLLOWER_CAL_P_FTDC_D: 4
  BIAS_FOLLOWER_CAL_P_FTDC_EN: 1
  BIAS_I_CTDC_D: 10
  BIAS_I_FTDC_D: 10
  CTDC_CALIB_FREQUENCY: 2
  FOLLOWER_CTDC_EN: 1
  FOLLOWER_FTDC_EN: 1
  FTDC_CALIB_FREQUENCY: 2
  GLOBAL_EN_BUFFER_CTDC: 1
  GLOBAL_EN_BUFFER_FTDC: 1
ReferenceVoltage_*:
  Inv_vref: 400
  Noinv_vref: 250
  Refi: 1
  Toa_vref: 200
  Tot_vref: 500
  Vbg_1v: 3
Top:
  BIAS_I_PLL_D: 63
  EN_HIGH_CAPA: 1
  RunL: 1
  RunR: 1
